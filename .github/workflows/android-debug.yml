name: Build ExpenseHub V8 Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 21}
      - run: npm ci --no-audit --no-fund
      - run: if [ ! -d android ]; then npx cap add android; fi
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with: {name: ExpenseHub-V8-debug-apk, path: android/app/build/outputs/apk/debug/app-debug.apk}
