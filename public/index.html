<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="stylesheet" href="/styles.css?v=6"><link rel="icon" href="/assets/icon.svg"><title>ExpenseHub V6</title></head><body><section id="auth" class="auth"></section><div id="secure" hidden><header><div class="brand"><img src="/assets/icon.svg"><div><b>ExpenseHub V6</b><small>Shared private money manager</small></div></div><button id="menu">☰</button></header><div class="shell"><aside id="side"><nav><button data-v="dashboard">Dashboard</button><button data-a="single">Single expense add</button><button data-a="mass">Mass expense add</button><button data-v="personal">Personal expenses</button><button data-v="vendor">Vendor payments</button><button data-v="received">Money received</button><button data-v="folders">Folders</button><button id="loadNav" data-a="load">Load CSV file</button><button data-v="share">Share & users</button><button data-v="settings">Settings & backup</button></nav><div id="status"></div></aside><main id="app"></main></div></div><dialog id="dlg"><form id="entry"><h2>Transaction</h2><input type="hidden" name="id"><label>Register<select name="type"><option value="personal">Personal</option><option value="vendor">Vendor</option><option value="received">Received</option></select></label><label>Folder<select name="folderId"></select></label><label>Person/vendor<input name="party" required></label><label>Amount<input name="amount" type="number" min=".01" step=".01" required></label><label>Date<input name="date" type="date" required></label><label>Mode<input name="mode" value="Bank Transfer"></label><label>Notes<textarea name="notes"></textarea></label><div class="actions"><button type="button" id="cancel">Cancel</button><button class="primary">Save</button></div></form></dialog><div id="toast"></div><script src="/app.js?v=6"></script></body></html>
